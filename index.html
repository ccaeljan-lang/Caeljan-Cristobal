<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Link in Bio</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<main class="container">
  <article class="profile-card">
    <!-- Profile Picture -->
    <div class="profile-image-wrapper">
      <img id="profile-image" src="" alt="" class="profile-image">
    </div>

    <!-- Name -->
    <h1 class="name" id="name">Cj</h1>

    <!-- Username -->
    <p class="username" id="username">@caeljan</p>

    <!-- Bio -->
    <p class="bio" id="bio">Computer Engineering student & developer</p>

    <!-- Links -->
    <div class="links" id="links"></div>
  </article>
</main>
<script src="profile.js"></script>
</body>
</html>
